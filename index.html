<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ron Lab</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000222">
    <meta name="apple-mobile-web-app-title" content="Ron Lab">
    <meta name="application-name" content="Ron Lab">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <!-- Apple Mobile Web App Status Bar Style -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        /* Hero section styles */
        .hero {
            background: linear-gradient(135deg, #000222 0%, #1a1a3e 100%);
            color: #fff;
            padding: 3rem 2rem;
            text-align: center;
            margin-bottom: 2rem;
            border-radius: 8px;
            animation: fadeUp 0.6s ease-out;
        }

        .hero h2 {
            font-family: 'biome', sans-serif;
            font-size: 2rem;
            margin: 0 0 1rem 0;
            color: #ffffff;
        }

        .hero p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            color: #defffc;
        }

        /* Section titles */
        .section-title {
            font-family: 'biome', sans-serif;
            color: #b12124;
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            position: relative;
            padding-bottom: 0.75rem;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: #b12124;
            border-radius: 2px;
        }

        .dark-mode .hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a4e 100%);
        }

        .dark-mode .hero h2 {
            color: #defffc;
        }

        .dark-mode .section-title {
            color: #defffc;
        }

        .dark-mode .section-title::after {
            background-color: #defffc;
        }

        /* Card link wrapper */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }

        .card-link:visited .card h3 {
            color: #000222;
        }

        .dark-mode .card-link:visited .card h3 {
            color: #defffc;
        }

        /* Responsive container */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header>
        <img src="/favicon-32x32.png" alt="Ron Lab Logo" class="header-logo">
        <h1>Welcome to the RonLab</h1>
    </header>

    <main class="content-container">
        <!-- Hero Section -->
        <section class="hero">
            <h2>Your Personal Lab Hub</h2>
            <p>A collection of services, projects, and experiments. Explore various tools for media, storage, information, and play.</p>
        </section>

        <!-- Dynamic Services Grid -->
        <div id="dynamic-card-grid"></div>
    </main>

    <footer>
        <p>&copy; 2023–<span id="year"></span> ron</p>
        <p><a href="sitemap.html">Sitemap</a></p>
        <p style="font-size: 0.9rem; color: #999; margin-top: 0.5rem;">Crafted with passion and curiosity</p>
    </footer>

    <button id="darkModeToggle">Toggle Dark Mode</button>

    <script src="/theme.js"></script>
    <script src="/app.js"></script>

</body>
</html>
