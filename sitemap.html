<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000222">
    <meta name="apple-mobile-web-app-title" content="Ron Lab">
    <meta name="application-name" content="Ron Lab">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
    <header>
        <img src="/favicon-32x32.png" alt="Ron Lab Logo" class="header-logo">
        <h1>Sitemap</h1>
    </header>
    <main>
        <section>
            <h2>Site Pages</h2>
            <table id="sitemap-table">
                <thead>
                    <tr>
                        <th>Page Name</th>
                        <th>Description</th>
                        <th>URL</th>
                    </tr>
                </thead>
                <tbody id="dynamic-sitemap-table">
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <p>&copy; 2023–<span id="year"></span> ron</p>
        <p><a href="sitemap.html">Sitemap</a> | <a href="index.html">Back to Home</a></p>
    </footer>
    <script src="/theme.js"></script>
    <script src="/app.js"></script>
</body>
</html>
